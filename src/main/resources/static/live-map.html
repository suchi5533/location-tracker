<!DOCTYPE html>
<html>
<head>
    <title>Live Location Tracking</title>
    <meta charset="UTF-8">

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SockJS & STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const deviceId = "EMP002"; // 🔁 change device id if needed

    // Initial map position
    const map = L.map('map').setView([18.5204, 73.8567], 16);

    // OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Marker
    const marker = L.marker([18.5204, 73.8567]).addTo(map);

    function connectWebSocket() {
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);

        stompClient.debug = null; // silence logs

        stompClient.connect({}, () => {
            console.log("WebSocket connected");

            stompClient.subscribe("/topic/location/" + deviceId, message => {
                const data = JSON.parse(message.body);

                const latLng = [data.latitude, data.longitude];
                marker.setLatLng(latLng);
                map.setView(latLng);
            });
        }, () => {
            console.warn("WebSocket disconnected, retrying...");
            setTimeout(connectWebSocket, 3000);
        });
    }

    connectWebSocket();
</script>

</body>
</html>
